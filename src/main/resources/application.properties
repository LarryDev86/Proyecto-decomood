spring.application.name=DecoMood
email.usuario=${EMAIL_USUARIO}
email.password=${PASS_USUARIO_EMAIL}
email.empresa=${EMAIL_USUARIO}

#Ruta donde almacenaremos las foto del proyecto
app.upload.dir=${FOTOS}

#Ajustes para la base de datos H2
# URL de la base de datos (puedes cambiar 'mem:testdb' por 'file:./data/mi_bd' si la quieres en disco)
# mem -> quiere decir en memoria y una vez que apagas la app, vuelve a quedarse vacia la BD
# si quieres persistencia cambialo por file.
spring.datasource.url=jdbc:h2:file:./data/databasePrueba;
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${USERNAME}
spring.datasource.password=${PASSWORD}

# Habilitar la consola web de H2 (Muy útil)
spring.h2.console.enabled=true
# Ruta para acceder a la consola en tu navegador (ej:
# )
spring.h2.console.path=/h2-console
#Esta linea hace que se cree sola la tabla a traves de la entidad de java
spring.jpa.hibernate.ddl-auto=update