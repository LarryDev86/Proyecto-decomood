
<html xmlns:th="http://www.thymeleaf.org">
    <head>
         <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="estilos/EstiloFormulario.css">
        <title>Formulario Deco Mood</title>
    </head>
    <body>
        <div class="contenedor">
            <form th:action="@{/gestion}" method="get">
                 <label for="nombre">Nombre*</label><br>
                 <input type="text" id="nombre" name="nombre" required><br><!-- comment -->
                 <label for="email">Email*</label><br>
                 <input type="text" id="email" name="email" required><br><!-- comment -->
                 <label for="descripcion">Descripcion*</label><br>
                 <textarea id="descripcion" name="descripcion" rows="4" placeholder="Escribe Aqui..." required></textarea><br>
                 <button class="boton" type="submit">Enviar</button>
            </form>
        </div>
    </body>
</html>
